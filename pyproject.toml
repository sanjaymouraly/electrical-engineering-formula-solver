[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ee-toolkit"
version = "1.0.0"
description = "Electrical Engineering Formula Solver — validated EE calculations with units, symbolic solving, CLI and Streamlit UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
keywords = ["electrical-engineering", "ohms-law", "three-phase", "power-factor", "voltage-drop"]
dependencies = [
  "numpy>=1.26",
  "sympy>=1.12",
  "Pint>=0.23",
  "pandas>=2.1",
  "typer>=0.12",
]

[project.optional-dependencies]
app = ["Streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "playwright>=1.40"]

[project.scripts]
ee-toolkit = "ee_toolkit.cli.main:main"

[project.urls]
Homepage = "https://github.com/sanjaymouraly/electrical-engineering-formula-solver"
Repository = "https://github.com/sanjaymouraly/electrical-engineering-formula-solver"
Issues = "https://github.com/sanjaymouraly/electrical-engineering-formula-solver/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ee_toolkit"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "E741", "B008"]  # E741: I is the conventional current symbol; B008: Typer Argument/Option defaults are the framework idiom

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ee_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
